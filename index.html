<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 公開網址一律走 HTTPS（PWA 安裝、Service Worker、剪貼簿都需要安全來源）
      (function () {
        var h = location.hostname;
        var local = /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|\[)/.test(h) || /\.(local|localhost|test)$/.test(h);
        if (location.protocol === 'http:' && !local) location.replace('https:' + location.href.slice(5));
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="純前端、點對點的跨裝置共享空間" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="共享空間" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>P2P 共享空間</title>

</html>
